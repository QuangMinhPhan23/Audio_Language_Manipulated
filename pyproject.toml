[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "musicwhy"
version = "0.1.0"
description = "MusicWhy: Understanding music through computational analysis and LLM-powered annotation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "MusicWhy Team" },
]
dependencies = [
    "librosa>=0.10",
    "soundfile>=0.12",
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "h5py>=3.9",
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.0",
    "tqdm>=4.65",
    "joblib>=1.3",
    "faiss-cpu>=1.7",
    "datasets>=2.14",
    "wbgapi>=1.0",
    "fredapi>=0.5",
    "requests>=2.31",
    "pydantic>=2.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.1",
    "torchaudio>=2.1",
    "demucs>=4.0",
    "transformers>=4.35",
    "accelerate>=0.24",
]
api = [
    "anthropic>=0.25",
    "openai>=1.12",
    "google-generativeai>=0.5",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
]
all = [
    "musicwhy[gpu,api,dev]",
]

[project.scripts]
musicwhy = "musicwhy.cli:main"

[tool.setuptools.packages.find]
include = ["musicwhy*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["musicwhy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests requiring GPU",
    "api: marks tests requiring API keys",
]
